# Autoresearch goals for sales-assistant project
# Run: sk-autoresearch autoresearch.yml [goal-name]

goals:
  - name: keyword-coverage
    description: Improve tender scraper keyword match rate without increasing false positives
    scope: materials/tenders/keywords.yml
    metric_cmd: >
      python3 -c "
      from scripts.tender_scraper import _load_keywords;
      from pathlib import Path;
      import yaml;
      kws = _load_keywords();
      cases = list(Path('materials/tenders/cases').glob('*.md'));
      matched = 0;
      for c in cases:
        t = c.read_text()[:500].lower();
        if any(kw.lower() in t for kw in kws): matched += 1;
      print(len(kws))
      "
    direction: higher
    verify_cmd: "python3 -c \"from scripts.tender_scraper import _load_keywords; kws=_load_keywords(); assert len(kws)>50, f'Too few keywords: {len(kws)}'; print(f'OK: {len(kws)} keywords')\""
    max_iterations: 10
    cooldown_secs: 60
    stale_limit: 3
    prompt: |
      Analyze unmatched tender titles and improve keyword coverage in materials/tenders/keywords.yml.

      Rules:
      - Only add keywords to the `active` section under appropriate categories
      - Chinese compound terms (≥2 chars) are safe
      - English abbreviations ≤2 chars are BANNED (high false positive risk)
      - For ambiguous English terms, use compound form (e.g. "API介接" not "API")
      - Check the `rejected` list — do NOT re-add rejected keywords
      - Each iteration: add 3-5 keywords maximum (small, testable changes)
      - Explain each addition with a sample tender title that would match
